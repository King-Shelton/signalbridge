name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run check:web

  api:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
        env:
          PYTHONPATH: .
          SIGNALBRIDGE_ENVIRONMENT: test
          SIGNALBRIDGE_JWT_SECRET: ci-test-secret-do-not-use-in-prod
