services:
  - type: web
    name: signalbridge-api
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/King-Shelton/signalbridge
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SIGNALBRIDGE_ENVIRONMENT
        value: render
      - key: SIGNALBRIDGE_DATABASE_URL
        fromDatabase:
          name: signalbridge-postgres
          property: connectionString
      - key: SIGNALBRIDGE_JWT_SECRET
        generateValue: true
      - key: SIGNALBRIDGE_OPENAI_API_KEY
        sync: false
      - key: SIGNALBRIDGE_OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: SIGNALBRIDGE_OPENAI_MODEL
        value: openai/gpt-4o-mini
      - key: SIGNALBRIDGE_CORS_ORIGINS
        value: https://signalbridge-web.onrender.com
      # Lets the API auto-register its Telegram webhook on startup.
      - key: SIGNALBRIDGE_PUBLIC_BASE_URL
        value: https://signalbridge-api-6wc6.onrender.com
      # Set these in the Render dashboard (mark as Secret) to enable the bots.
      - key: SIGNALBRIDGE_TELEGRAM_BOT_TOKEN
        sync: false
      - key: SIGNALBRIDGE_TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: SIGNALBRIDGE_DISCORD_BOT_TOKEN
        sync: false
      - key: SIGNALBRIDGE_DISCORD_WEBHOOK_URL
        sync: false

  - type: web
    name: signalbridge-web
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/King-Shelton/signalbridge
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: SIGNALBRIDGE_API_URL
        value: https://signalbridge-api-6wc6.onrender.com
      - key: NEXT_PUBLIC_SIGNALBRIDGE_API_URL
        value: /api

databases:
  - name: signalbridge-postgres
    databaseName: signalbridge
    user: signalbridge
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
